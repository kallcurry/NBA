name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check server.mjs
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test schedule cache and watch sources
        run: npm test

      - name: Smoke test the app
        run: |
          node server.mjs > /tmp/courtside.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/api/health
          curl -fsS http://127.0.0.1:4321/ | grep -q 'COURTSIDE'
          curl -fsS http://127.0.0.1:4321/manifest.webmanifest | grep -q '场边'

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag courtside:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name courtside-ci -p 4322:4321 courtside:ci
          trap 'docker rm -f courtside-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4322/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4322/api/health
          docker rm -f courtside-ci >/dev/null

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed debug APK
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: courtside-apk
          path: android/dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
